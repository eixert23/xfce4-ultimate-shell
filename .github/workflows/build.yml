name: build

on:
  push:
  pull_request:

jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config \
            libgtk-3-dev libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev libxfconf-0-dev \
            libwnck-3-dev libx11-dev libxtst-dev libdbusmenu-gtk3-dev
      - name: Build
        run: |
          meson setup build -Dwerror=false
          ninja -C build

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y gcc meson ninja-build pkgconf-pkg-config gtk3-devel xfce4-panel-devel \
            libxfce4ui-devel libxfce4util-devel xfconf-devel libwnck3-devel libX11-devel \
            libXtst-devel libdbusmenu-gtk3-devel
      - name: Build
        run: |
          meson setup build
          ninja -C build
